name: NFL injury feed audit (main)

on:
  workflow_dispatch:

  # Enable scheduling after manual verification.
  # schedule:
  #   - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: nfl-injury-feed-main
  cancel-in-progress: false

jobs:
  update-injuries:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update NFL injury feed
        run: python scripts/update_nfl_injuries.py

      - name: Commit updated injury data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nfl_injuries.json

          if git diff --cached --quiet; then
            echo "No injury data changes."
          else
            git commit -m "Update NFL injury feed snapshot"
            git push origin HEAD:main
          fi

