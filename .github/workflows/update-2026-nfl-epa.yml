name: Update 2026 NFL efficiency research feed
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'pyarrow>=17,<25'
      - run: python scripts/build_2026_epa.py
      - name: Commit updated research feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl_epa_2026.json
          if ! git diff --cached --quiet; then git commit -m 'Update 2026 NFL EPA research feed'; git push; fi
